<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YOLO26 Vision App</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --muted:#667085; --line:#e4e7ec; --accent:#2f5bea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1216; --card:#181c22; --ink:#e8eaed; --muted:#98a2b3; --line:#2a303a; --accent:#6b8cff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .controls { display:flex; flex-wrap:wrap; gap:16px; align-items:center; }
  .drop { flex:1 1 260px; border:2px dashed var(--line); border-radius:10px; padding:18px; text-align:center; cursor:pointer; color:var(--muted); }
  .drop.over { border-color:var(--accent); color:var(--accent); }
  label.chk { display:inline-flex; gap:6px; align-items:center; margin-right:10px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 18px; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  #grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; margin-top:20px; }
  #grid img { width:100%; border-radius:8px; display:block; }
  #grid h2 { font-size:1rem; margin:0 0 10px; text-transform:capitalize; }
  .sum { font-size:.9rem; color:var(--muted); margin-top:10px; }
  .sum table { width:100%; border-collapse:collapse; }
  .sum td, .sum th { text-align:left; padding:2px 6px 2px 0; }
  .err { color:#d92d20; }
  #status { margin-top:14px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>YOLO26 Vision App</h1>
  <p class="sub">Upload an image to run detection, segmentation, classification and pose estimation.</p>

  <div class="card">
    <div class="controls">
      <div class="drop" id="drop">Drop an image here or click to choose<input id="file" type="file" accept="image/*" hidden></div>
      <div>
        <div>
          <label class="chk"><input type="checkbox" value="detection" checked> Detection</label>
          <label class="chk"><input type="checkbox" value="segmentation" checked> Segmentation</label>
          <label class="chk"><input type="checkbox" value="classification" checked> Classification</label>
          <label class="chk"><input type="checkbox" value="pose" checked> Pose</label>
        </div>
        <div style="margin-top:10px">
          <label>Confidence: <b id="confv">0.25</b>
            <input id="conf" type="range" min="0.05" max="0.95" step="0.05" value="0.25"></label>
        </div>
      </div>
      <button id="run" disabled>Run</button>
    </div>
    <div id="status"></div>
  </div>

  <div id="grid"></div>

  <h1 style="margin-top:36px">Video</h1>
  <p class="sub">Upload a short clip (up to 30 s). Tracking gives each object an ID across frames.</p>
  <div class="card">
    <div class="controls">
      <div class="drop" id="vdrop">Drop a video here or click to choose<input id="vfile" type="file" accept="video/*" hidden></div>
      <div>
        <label>Task:
          <select id="vtask">
            <option value="detection">Detection</option>
            <option value="segmentation">Segmentation</option>
            <option value="pose">Pose</option>
          </select></label>
        <label class="chk" style="margin-left:12px"><input type="checkbox" id="vtrack" checked> Track objects</label>
        <div style="margin-top:10px">
          <label>Confidence: <b id="vconfv">0.4</b>
            <input id="vconf" type="range" min="0.05" max="0.95" step="0.05" value="0.4"></label>
        </div>
      </div>
      <button id="vrun" disabled>Run on video</button>
    </div>
    <div id="vstatus" style="margin-top:14px;color:var(--muted)"></div>
    <div id="vout"></div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const drop = $('#drop'), fileIn = $('#file'), run = $('#run'), grid = $('#grid'), status = $('#status');
let file = null;

function setFile(f) {
  if (!f) return;
  file = f; drop.textContent = f.name; run.disabled = false;
}
drop.addEventListener('click', e => { if (e.target !== fileIn) fileIn.click(); });
fileIn.addEventListener('change', () => setFile(fileIn.files[0]));
['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => setFile(e.dataTransfer.files[0]));
$('#conf').addEventListener('input', e => $('#confv').textContent = e.target.value);

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function summaryHtml(task, s) {
  if (task === 'detection') {
    const rows = Object.entries(s.counts).map(([k,v]) => `<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('');
    return `<b>${s.total}</b> object(s)<table>${rows}</table>`;
  }
  if (task === 'segmentation') {
    const rows = s.instances.map(i => `<tr><td>${esc(i.label)}</td><td>${(i.percent_of_image)}% of image</td></tr>`).join('');
    return `<b>${s.total}</b> instance(s)<table>${rows}</table>`;
  }
  if (task === 'classification') {
    return '<table>' + s.top5.map(i => `<tr><td>${esc(i.label)}</td><td>${i.confidence.toFixed(2)}</td></tr>`).join('') + '</table>';
  }
  if (task === 'pose') return `<b>${s.persons}</b> person(s) with body keypoints`;
  return '';
}

run.addEventListener('click', async () => {
  const tasks = [...document.querySelectorAll('.chk input:checked')].map(c => c.value);
  if (!file || !tasks.length) { status.textContent = 'Pick an image and at least one task.'; return; }
  const fd = new FormData();
  fd.append('file', file); fd.append('tasks', tasks.join(',')); fd.append('conf', $('#conf').value);
  run.disabled = true; grid.innerHTML = '';
  status.textContent = 'Running… the first request downloads and loads the models, so it can take a while.';
  try {
    const res = await fetch('/api/predict', { method: 'POST', body: fd });
    const j = await res.json();
    if (!res.ok) throw new Error(j.detail || res.statusText);
    for (const [task, r] of Object.entries(j.results)) {
      const card = document.createElement('div'); card.className = 'card';
      card.innerHTML = r.error
        ? `<h2>${task}</h2><p class="err">${esc(r.error)}</p>`
        : `<h2>${task}</h2><img src="${r.image}" alt="${task} result"><div class="sum">${summaryHtml(task, r.summary)}</div>`;
      grid.appendChild(card);
    }
    status.textContent = '';
  } catch (err) {
    status.innerHTML = `<span class="err">${esc(err.message)}</span>`;
  } finally { run.disabled = false; }
});

// ---- Video ----
const vdrop = $('#vdrop'), vfileIn = $('#vfile'), vrun = $('#vrun'), vstatus = $('#vstatus'), vout = $('#vout');
let vfile = null;
function setVFile(f) { if (!f) return; vfile = f; vdrop.textContent = f.name; vrun.disabled = false; }
vdrop.addEventListener('click', e => { if (e.target !== vfileIn) vfileIn.click(); });
vfileIn.addEventListener('change', () => setVFile(vfileIn.files[0]));
['dragover','dragenter'].forEach(ev => vdrop.addEventListener(ev, e => { e.preventDefault(); vdrop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => vdrop.addEventListener(ev, e => { e.preventDefault(); vdrop.classList.remove('over'); }));
vdrop.addEventListener('drop', e => setVFile(e.dataTransfer.files[0]));
$('#vconf').addEventListener('input', e => $('#vconfv').textContent = e.target.value);

vrun.addEventListener('click', async () => {
  if (!vfile) return;
  const fd = new FormData();
  fd.append('file', vfile); fd.append('task', $('#vtask').value);
  fd.append('track', $('#vtrack').checked); fd.append('conf', $('#vconf').value);
  vrun.disabled = true; vout.innerHTML = '';
  vstatus.textContent = 'Processing every frame… this can take a minute or more on a CPU. Keep this tab open.';
  try {
    const res = await fetch('/api/video', { method: 'POST', body: fd });
    const j = await res.json();
    if (!res.ok) throw new Error(j.detail || res.statusText);
    const s = j.stats;
    let info = `${s.frames} frames · up to ${s.max_objects_in_a_frame} objects in one frame`;
    if (s.unique_objects !== undefined) {
      const by = Object.entries(s.unique_by_class).map(([k,v]) => `${esc(k)}: ${v}`).join(', ');
      info += `<br><b>${s.unique_objects}</b> unique tracked object(s)${by ? ' (' + by + ')' : ''}`;
    }
    vout.innerHTML = `<video controls style="width:100%;max-width:720px;margin-top:14px;border-radius:8px" src="${j.video_url}"></video>
      <div class="sum">${info} · <a href="${j.video_url}" download>Download</a></div>`;
    vstatus.textContent = '';
  } catch (err) {
    vstatus.innerHTML = `<span class="err">${esc(err.message)}</span>`;
  } finally { vrun.disabled = false; }
});
</script>
</body>
</html>
